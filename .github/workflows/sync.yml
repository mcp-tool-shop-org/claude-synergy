name: Daily sync

on:
  schedule:
    - cron: '0 12 * * *'  # daily at noon UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_SYNERGY_DB: data/claude-synergy.db
      CLAUDE_SYNERGY_NO_AUTO_SYNC: '1'
    # main is protected (required check "test"), so the bot never pushes to it.
    # It force-updates one rolling branch, opens or refreshes a PR, dispatches
    # the test workflow on that branch (a GITHUB_TOKEN push or PR triggers no
    # workflows, but a dispatch does), and lets auto-merge land it when green.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (windsurf source)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm exec playwright install --with-deps chromium

      - name: Install Ollama (local models only)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 10
          command: curl -fsSL https://ollama.ai/install.sh | sh

      # The daemon must outlive its step. Starting it inside the retry wrapper's
      # child process (the old way) killed it when that step exited, so the
      # embed stage later got "fetch failed" on localhost:11434.
      - name: Start Ollama daemon
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && echo "ollama ready after ${i}s" && exit 0
            sleep 1
          done
          echo "ollama did not become ready"; cat "$RUNNER_TEMP/ollama.log" || true
          exit 1

      # Sync embeds with the structured context provider, so only the embedding
      # model is needed (no chat model).
      - name: Pull embedding model
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: ollama pull nomic-embed-text

      - name: Build CLI
        run: pnpm build

      # data/*.db is gitignored, so without this every run re-embedded all
      # ~17k chunks from scratch (~28 min on CPU). Restoring the previous DB
      # makes embed incremental; the first (cold) run still needs the long budget.
      - name: Restore sync database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/claude-synergy.db
          key: sync-db-${{ github.run_id }}
          restore-keys: sync-db-

      # One attempt: a retry would re-run a 20+ minute embed inside the same job budget.
      - name: Sync (fetch + ingest + embed)
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node dist/cli.js sync 2>&1 | tee "$RUNNER_TEMP/sync.log"

      - name: Refresh top-level summaries
        run: |
          node dist/cli.js --no-stamp products > PRODUCTS.txt
          node dist/cli.js --no-stamp latest --limit 50 > LATEST.txt

      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_SYNC_PR_DAYS: '3'
        run: |
          git config user.name "claude-synergy-bot"
          git config user.email "bot@mcp-tool-shop.dev"
          git add -A data/ products/ URGENT_FINDINGS.md SOURCES.md PRODUCTS.txt LATEST.txt
          if git diff --staged --quiet; then echo "No changes to sync."; exit 0; fi
          day=$(date -u +%F)
          git commit -q -m "Daily sync $day"
          git push --force origin HEAD:refs/heads/sync/daily

          {
            echo "Automated daily sync, $day (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo '```'
            grep -E '^(Sync complete|ingested|embedded)' "$RUNNER_TEMP/sync.log" || true
            git diff --shortstat HEAD~1 HEAD
            echo '```'
            echo
            echo "Merges itself when the required \`test\` check passes. If it is still open, \`test\` failed: read that run before tomorrow's sync replaces this branch."
          } > "$RUNNER_TEMP/body.md"

          pr_info=$(gh pr list --head sync/daily --base main --state open --json number,createdAt -q '.[0]')
          if [ -z "$pr_info" ] || [ "$pr_info" = "null" ]; then
            gh pr create --base main --head sync/daily --title "Daily sync $day" --body-file "$RUNNER_TEMP/body.md"
            gh workflow run test.yml --ref sync/daily
            gh pr merge sync/daily --auto --squash
            exit 0
          fi

          num=$(printf '%s' "$pr_info" | jq -r '.number')
          created_at=$(printf '%s' "$pr_info" | jq -r '.createdAt')
          decision=$(node scripts/check-stale-sync-pr.mjs --created-at "$created_at" --today "$day" --max-days "$STALE_SYNC_PR_DAYS")
          stale=$(printf '%s' "$decision" | jq -r '.stale')
          age_days=$(printf '%s' "$decision" | jq -r '.ageDays')
          created_date=$(printf '%s' "$decision" | jq -r '.createdDate')
          pr_title=$(printf '%s' "$decision" | jq -r '.title')
          marker=$(printf '%s' "$decision" | jq -r '.commentMarker')

          if [ "$stale" != "true" ]; then
            gh pr edit "$num" --title "$pr_title" --body-file "$RUNNER_TEMP/body.md"
            gh workflow run test.yml --ref sync/daily
            gh pr merge sync/daily --auto --squash
            exit 0
          fi

          failed_run=$(gh run list --workflow test.yml --branch sync/daily --status failure --limit 1 --json databaseId,url -q 'if length > 0 then "run #\(.[0].databaseId) (\(.[0].url))" else "" end' || true)
          if [ -z "$failed_run" ]; then
            failed_run=$(gh run list --workflow test.yml --branch sync/daily --limit 5 --json databaseId,url,conclusion -q '[.[] | select(.conclusion != "success" and .conclusion != null)][0] | if . then "run #\(.databaseId) (\(.url), conclusion=\(.conclusion))" else "no completed failed test.yml run found on sync/daily" end' || echo "no completed failed test.yml run found on sync/daily")
          fi

          gh pr edit "$num" --title "$pr_title" --body-file "$RUNNER_TEMP/body.md"
          if ! gh label create sync-stale --color d93f0b --description "Daily sync PR stuck open past STALE_SYNC_PR_DAYS" --force; then
            echo "::warning::Could not create or update sync-stale label (pull-requests: write may not grant repo label creation)." >&2
          fi
          if ! gh api "repos/${{ github.repository }}/issues/$num/labels" --method POST -f "labels[]=sync-stale" >/dev/null; then
            echo "::warning::Could not attach sync-stale label to PR #$num." >&2
          fi
          stale_body=$(printf '%s\nDaily sync PR #%s has been open since %s (%s days > STALE_SYNC_PR_DAYS=%s). Latest failed `test` run on `sync/daily`: %s. Refreshed `sync/daily` for %s.' \
            "$marker" "$num" "$created_date" "$age_days" "$STALE_SYNC_PR_DAYS" "$failed_run" "$day")
          existing_comment_id=$(gh api --paginate "repos/${{ github.repository }}/issues/$num/comments" \
            -q "[.[] | select(.body | contains(\"$marker\"))][0].id // empty" || true)
          if [ -n "$existing_comment_id" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$existing_comment_id" --method PATCH -f body="$stale_body" >/dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$num/comments" --method POST -f body="$stale_body" >/dev/null
          fi
          gh workflow run test.yml --ref sync/daily
          gh pr merge sync/daily --auto --squash || true
          echo "::error::Daily sync PR #$num has been open since $created_date ($age_days days > STALE_SYNC_PR_DAYS=$STALE_SYNC_PR_DAYS). Latest failed test run: $failed_run" >&2
          exit 1

name: Daily sync

on:
  schedule:
    - cron: '0 12 * * *'  # daily at noon UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # main is protected (required check "test"), so the bot never pushes to it.
    # It force-updates one rolling branch, opens or refreshes a PR, dispatches
    # the test workflow on that branch (a GITHUB_TOKEN push or PR triggers no
    # workflows, but a dispatch does), and lets auto-merge land it when green.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (windsurf source)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm exec playwright install --with-deps chromium

      - name: Install Ollama (local models only)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 10
          command: curl -fsSL https://ollama.ai/install.sh | sh

      # The daemon must outlive its step. Starting it inside the retry wrapper's
      # child process (the old way) killed it when that step exited, so the
      # embed stage later got "fetch failed" on localhost:11434.
      - name: Start Ollama daemon
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          fi
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && echo "ollama ready after ${i}s" && exit 0
            sleep 1
          done
          echo "ollama did not become ready"; cat "$RUNNER_TEMP/ollama.log" || true
          exit 1

      # Sync embeds with the structured context provider, so only the embedding
      # model is needed (no chat model).
      - name: Pull embedding model
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: ollama pull nomic-embed-text

      - name: Build CLI
        run: pnpm build

      # data/*.db is gitignored, so without this every run re-embedded all
      # ~17k chunks from scratch (~28 min on CPU). Restoring the previous DB
      # makes embed incremental; the first (cold) run still needs the long budget.
      - name: Restore sync database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/claude-synergy.db
          key: sync-db-${{ github.run_id }}
          restore-keys: sync-db-

      # One attempt: a retry would re-run a 20+ minute embed inside the same job budget.
      - name: Sync (fetch + ingest + embed)
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node dist/cli.js sync 2>&1 | tee "$RUNNER_TEMP/sync.log"

      - name: Refresh top-level summaries
        run: |
          node dist/cli.js products > PRODUCTS.txt
          node dist/cli.js latest --limit 50 > LATEST.txt

      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "claude-synergy-bot"
          git config user.email "bot@mcp-tool-shop.dev"
          git add -A data/ products/ URGENT_FINDINGS.md SOURCES.md PRODUCTS.txt LATEST.txt
          if git diff --staged --quiet; then echo "No changes to sync."; exit 0; fi
          day=$(date -u +%F)
          git commit -q -m "Daily sync $day"
          git push --force origin HEAD:refs/heads/sync/daily

          {
            echo "Automated daily sync, $day (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo '```'
            grep -E '^(Sync complete|ingested|embedded)' "$RUNNER_TEMP/sync.log" || true
            git diff --shortstat HEAD~1 HEAD
            echo '```'
            echo
            echo "Merges itself when the required \`test\` check passes. If it is still open, \`test\` failed: read that run before tomorrow's sync replaces this branch."
          } > "$RUNNER_TEMP/body.md"

          num=$(gh pr list --head sync/daily --base main --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh pr create --base main --head sync/daily --title "Daily sync $day" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$num" --title "Daily sync $day" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run test.yml --ref sync/daily
          gh pr merge sync/daily --auto --squash

name: Daily sync

on:
  schedule:
    - cron: '0 12 * * *'  # daily at noon UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm install --frozen-lockfile

      - name: Install Ollama (free LLM provider)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://ollama.ai/install.sh | sh
            ollama serve &
            sleep 5
            ollama pull llama3.2:3b
            ollama pull nomic-embed-text

      - name: Build CLI
        run: pnpm build

      - name: Sync (fetch + ingest + embed)
        uses: nick-fields/retry@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: node dist/cli.js sync

      - name: Refresh top-level summaries
        run: |
          node dist/cli.js products > PRODUCTS.txt
          node dist/cli.js latest --limit 50 > LATEST.txt

      - name: Commit changes if any
        run: |
          git config user.name "claude-synergy-bot"
          git config user.email "bot@mcp-tool-shop.dev"
          git add -A data/ products/ URGENT_FINDINGS.md SOURCES.md PRODUCTS.txt LATEST.txt
          git diff --staged --quiet || (git commit -m "Daily sync $(date -I)" && git push)
